<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <canvas id="game" width="800" height="220" aria-label="Dino-spelet"></canvas>
    <p class="help">
      <kbd>Space</kbd>/<kbd>↑</kbd> hoppa · <kbd>↓</kbd> ducka · <kbd>P</kbd> paus · tryck på skärmen för att hoppa
    </p>
    <section id="board" class="board" aria-live="polite">
      <form id="entry" class="entry" hidden>
        <label for="name">Nytt rekord! Skriv ditt namn:</label>
        <div class="entry-row">
          <input id="name" name="name" maxlength="12" autocomplete="off" spellcheck="false" required>
          <button type="submit">Spara</button>
        </div>
      </form>
      <h2>Topplista</h2>
      <ol id="scores"></ol>
      <p id="empty" class="empty">Inga resultat ännu – spela!</p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
